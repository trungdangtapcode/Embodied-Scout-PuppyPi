[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "puppypi-teach-and-find"
version = "0.1.0"
description = "Active Object Search Using Few-Shot Visual Memory and Topological Navigation for Hiwonder PuppyPi Standard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9,<1", "httpx>=0.28,<1", "fastapi>=0.115,<1", "python-multipart>=0.0.20,<1", "Pillow>=10", "huey==3.5.3"]
app = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.20,<1", "Pillow>=10", "huey==3.5.3"]
memory = ["huey==3.5.3", "openai>=3.42,<4", "Pillow>=10"]
sim = ["mujoco>=3.2,<4", "Pillow>=10"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Start with syntax and runtime-name errors; expand style checks incrementally.
select = ["E9", "F63", "F7", "F82"]

[tool.setuptools.packages.find]
include = ["teach_and_find*"]

[tool.setuptools.package-data]
"teach_and_find.mobile" = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
