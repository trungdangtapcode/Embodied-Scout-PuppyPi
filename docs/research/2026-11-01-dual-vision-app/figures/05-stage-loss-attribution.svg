  <g id="text_27">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #24352d" transform="translate(32.76 481.062551)">Derived from the recorded paired one-to-one evaluator counts, not new inference. Orange loss is caused by the project reference-decision stage; red loss occurs</text>
