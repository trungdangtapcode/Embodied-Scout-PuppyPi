   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #536159" transform="translate(35.28 470.26009)">One 640x480 target, 8 CPU threads, FP32; peak process RSS 1334 MiB. Cutie mean step 0.247 s, P95 0.295 s. Source reads, output writes and browser</text>
