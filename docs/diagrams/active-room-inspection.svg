<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
  <title id="title">Active room inspection with uncertain sources</title>
  <desc id="desc">Proposed experiment. A robot observes an occluded region while a phone reports a case at an older time. The world may have changed and the source may be stale simultaneously. Competing hypotheses predict different measurements; a validated action acquires evidence, which either resolves the task or leaves an explicit unknown. No measured probabilities or implemented screens are shown.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#537460"/></marker></defs>
  <rect width="1440" height="1120" fill="#f4f5f0"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#24352d">
    <text x="48" y="46" font-size="12" letter-spacing="3">PUPPYPI / RESEARCH DESIGN / PLANNED</text>
    <text x="48" y="94" font-size="34" font-weight="bold">Did the room change, or did the evidence fail?</text>
    <text x="48" y="126" font-size="17" fill="#657168">Choose a measurement that can distinguish explanations. Compare its prediction with what actually happens.</text>

    <rect x="48" y="160" width="650" height="206" rx="16" fill="#fff" stroke="#d5ddd2"/>
    <rect x="722" y="160" width="670" height="206" rx="16" fill="#fff" stroke="#d5ddd2"/>
    <text x="72" y="192" font-size="12" fill="#537460">ROBOT / LOW VIEW</text>
    <path d="M88 314H345V225H510V314H594" fill="none" stroke="#c3cfc1" stroke-width="3"/>
    <rect x="132" y="253" width="93" height="61" rx="6" fill="#e7efe3" stroke="#537460"/>
    <rect x="268" y="231" width="35" height="83" fill="#c3cfc1"/>
    <path d="M92 272L277 227M92 272L277 312" stroke="#aabb9f" stroke-dasharray="5 4" fill="none"/>
    <text x="356" y="261" font-size="19" font-weight="bold">Region partly blocked</text>
    <text x="356" y="290" font-size="14">Missed detection</text>
    <text x="72" y="344" font-size="14" fill="#805a19">Insufficient evidence of absence</text>
    <text x="746" y="192" font-size="12" fill="#537460">PHONE / EXTERNAL VIEW</text>
    <rect x="746" y="218" width="159" height="100" rx="8" fill="#e7efe3"/>
    <rect x="792" y="245" width="64" height="43" rx="5" fill="#fff" stroke="#537460" stroke-width="2"/>
    <text x="925" y="249" font-size="19" font-weight="bold">Case appears at A</text>
    <text x="925" y="278" font-size="14">Capture time / source validity uncertain</text>
    <text x="746" y="344" font-size="14" fill="#805a19">Recent receipt does not prove a fresh image</text>

    <path d="M720 366V408" fill="none" stroke="#537460" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="48" y="420" width="1344" height="180" rx="16" fill="#e7efe3" stroke="#c5d4c3"/>
    <text x="72" y="454" font-size="12" letter-spacing="2" fill="#537460">JOINT BELIEF / KEEP COMPETING EXPLANATIONS</text>
    <g fill="#fff"><rect x="72" y="474" width="304" height="80" rx="10"/><rect x="394" y="474" width="304" height="80" rx="10"/><rect x="716" y="474" width="304" height="80" rx="10"/><rect x="1038" y="474" width="330" height="80" rx="10"/></g>
    <g font-size="18" font-weight="bold"><text x="90" y="504">World state</text><text x="412" y="504">Object identity</text><text x="734" y="504">Source health</text><text x="1056" y="504">Observation geometry</text></g>
    <g font-size="13"><text x="90" y="533">Unchanged / moved / unknown</text><text x="412" y="533">Taught case / look-alike</text><text x="734" y="533">Fresh / stale / unavailable</text><text x="1056" y="533">Visible / blocked / invalid pose</text></g>
    <text x="72" y="579" font-size="14" fill="#537460">A real object move and a stale camera can occur together. The available evidence may not uniquely identify either.</text>

    <path d="M720 600V638" fill="none" stroke="#537460" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="48" y="638" font-size="12" letter-spacing="2" fill="#657168">PREDICT A TEST / THEN CHOOSE A FEASIBLE ACTION</text>
    <g fill="#fff" stroke="#d5ddd2"><rect x="48" y="660" width="432" height="164" rx="14"/><rect x="504" y="660" width="432" height="164" rx="14"/><rect x="960" y="660" width="432" height="164" rx="14"/></g>
    <g font-size="19" font-weight="bold"><text x="72" y="695">Check source freshness</text><text x="528" y="695">Inspect a distinctive side</text><text x="984" y="695">Check static anchors</text></g>
    <g font-size="14"><text x="72" y="727">Will a fresh, observable challenge appear?</text><text x="72" y="756">Separate stale pixels from an old sighting.</text><text x="72" y="796" fill="#657168">New phone capture / validated challenge</text><text x="528" y="727">Will the taught feature be visible?</text><text x="528" y="756">Separate the case from its look-alike.</text><text x="528" y="796" fill="#657168">Verified station or feasible body view</text><text x="984" y="727">Will known landmarks remain consistent?</text><text x="984" y="756">Test whether camera calibration is invalid.</text><text x="984" y="796" fill="#657168">Anchor observation / recalibration request</text></g>

    <path d="M264 824V850H1176V824M720 850V884" fill="none" stroke="#537460" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="48" y="896" width="1344" height="108" rx="14" fill="#243e30"/>
    <text x="72" y="934" font-size="22" font-weight="bold" fill="#fff">Measure the result → update belief → report with evidence or retain unknown</text>
    <text x="72" y="969" font-size="15" fill="#dce7d8">Record capture time, source/calibration lineage, predicted outcome, actual action result, cost and unresolved alternatives.</text>
    <text x="48" y="1044" font-size="15" font-weight="bold">Research test: joint estimation versus hard gates, visibility memory, and passive / active diagnosis cascades.</text>
    <text x="48" y="1080" font-size="13" fill="#657168">Design illustration only. All example hypotheses and actions are proposed. Physical execution requires separately validated routes and stop behavior.</text>
  </g>
</svg>
