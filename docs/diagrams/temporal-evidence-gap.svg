<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">Temporal evidence gaps and prospective observation</title>
<desc id="desc">Proposed experiment. An unchanged history and a move-and-return history yield identical robot images at the sampled endpoints. The unobserved middle cannot be recovered by looking now. Future monitoring can add valid external-camera captures, subject to explicit visibility, timing and minimum-event-duration assumptions. This is not real data, a delivered screen or a proof of continuous observation.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#537460"/></marker><pattern id="gap" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3L3-3M0 12L12 0M9 15L15 9" stroke="#e4d6b8" stroke-width="2"/></pattern></defs>
<rect width="1440" height="1080" fill="#f4f5f0"/>
<g font-family="DejaVu Sans,sans-serif" fill="#24352d">
<text x="48" y="44" font-size="12" letter-spacing="3">PUPPYPI / DEEP RESEARCH / PROPOSED EXPERIMENT</text>
<text x="48" y="92" font-size="34" font-weight="bold">A correct memory can still support the wrong time claim.</text>
<text x="48" y="126" font-size="17" fill="#657168">The question is not only what was seen, but which histories the observations can distinguish.</text>

<rect x="48" y="160" width="1344" height="432" rx="14" fill="#fff" stroke="#d5ddd2"/>
<text x="72" y="194" font-size="12" letter-spacing="2" fill="#537460">RETROSPECTIVE QUERY / DID THE CASE STAY AT A THROUGHOUT?</text>
<rect x="451" y="218" width="653" height="302" fill="#faf3e4"/>
<rect x="451" y="218" width="653" height="302" fill="url(#gap)"/>
<text x="650" y="250" font-size="14" font-weight="bold" fill="#805a19">UNOBSERVED INTERVAL</text>
<text x="80" y="300" font-size="16" font-weight="bold">History H0</text>
<text x="80" y="324" font-size="13">Case remains at A</text>
<path d="M390 301H1170" fill="none" stroke="#537460" stroke-width="5"/>
<text x="80" y="393" font-size="16" font-weight="bold">History H1</text>
<text x="80" y="417" font-size="13">Case leaves and returns</text>
<path d="M390 388H575L646 445H906L977 388H1170" fill="none" stroke="#a77b37" stroke-width="5"/>
<text x="738" y="470" font-size="13" fill="#805a19">Excursion at B</text>
<g fill="#fff" stroke="#537460" stroke-width="3"><circle cx="415" cy="301" r="10"/><circle cx="1135" cy="301" r="10"/><circle cx="415" cy="388" r="10"/><circle cx="1135" cy="388" r="10"/></g>
<text x="355" y="504" font-size="13">10:00 capture</text><text x="1081" y="504" font-size="13">10:10 capture</text>
<text x="72" y="557" font-size="18" font-weight="bold">Same sampled evidence. Different historical truth. A present look cannot recover the missing event.</text>

<rect x="48" y="616" width="1344" height="230" rx="14" fill="#e7efe3" stroke="#c5d4c3"/>
<text x="72" y="650" font-size="12" letter-spacing="2" fill="#537460">PROSPECTIVE TASK / MONITOR THE NEXT INTERVAL</text>
<text x="72" y="690" font-size="16" font-weight="bold">Robot close views + fixed-phone captures</text>
<path d="M476 709H1315" fill="none" stroke="#a5b49d" stroke-width="3"/>
<g fill="#537460"><circle cx="490" cy="709" r="9"/><circle cx="1300" cy="709" r="9"/></g>
<g fill="#fff" stroke="#537460" stroke-width="2"><rect x="602" y="700" width="18" height="18"/><rect x="724" y="700" width="18" height="18"/><rect x="846" y="700" width="18" height="18"/><rect x="968" y="700" width="18" height="18"/><rect x="1090" y="700" width="18" height="18"/><rect x="1212" y="700" width="18" height="18"/></g>
<text x="72" y="736" font-size="14">Measure valid capture gaps and region visibility.</text>
<text x="72" y="773" font-size="14">Compare periodic gated sensing with query-conditioned sensing under the same time, capture and movement budgets.</text>
<text x="72" y="813" font-size="14" fill="#537460">Duration-qualified coverage requires explicit assumptions. Sampled images alone do not prove continuous invariance.</text>

<g fill="#fff" stroke="#d5ddd2"><rect x="48" y="874" width="432" height="132" rx="12"/><rect x="504" y="874" width="432" height="132" rx="12"/><rect x="960" y="874" width="432" height="132" rx="12"/></g>
<g font-size="20" font-weight="bold"><text x="72" y="910">Supported</text><text x="528" y="910">Refuted</text><text x="984" y="910">Unknown</text></g>
<g font-size="14"><text x="72" y="944">All admissible histories satisfy the query.</text><text x="528" y="944">No admissible history satisfies the query.</text><text x="984" y="944">The evidence admits both answers.</text><text x="72" y="978" fill="#657168">Conditional on declared input assumptions</text><text x="528" y="978" fill="#657168">Cite the actual counterevidence</text><text x="984" y="978" fill="#657168">Retrieve, observe, ask or defer as appropriate</text></g>
<text x="48" y="1044" font-size="13" fill="#657168">Design figure only. No PuppyPi monitoring result, temporal guarantee, physical patrol or implemented interface is claimed.</text>
</g></svg>
